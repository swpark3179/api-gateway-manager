name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "올릴 버전 단위"
        required: true
        type: choice
        options: [major, minor, patch]
        default: patch

permissions:
  contents: write

# 동시 릴리스는 같은 브랜치·태그를 두고 경쟁한다.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    # keyring(windows-native) · windows-sys · rusqlite(bundled, MSVC) 때문에 Windows 러너 필수
    runs-on: windows-latest
    # lto = true + codegen-units = 1 + SQLite C 컴파일 → 콜드 빌드 20~30분
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # 태그에서 dispatch 하면 태그 이름의 브랜치를 새로 만들어 버린다.
      - name: 브랜치에서 실행되었는지 확인
        if: github.ref_type != 'branch'
        run: |
          echo "::error::브랜치에서 실행하세요. 현재: ${{ github.ref_type }} '${{ github.ref_name }}'"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 변경 로그 산출에 이전 태그와 전체 히스토리가 필요하다

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 1) 발행된 최신 버전 파악 → 2) 다음 버전 계산.
      # 20분이 넘는 빌드 '전에' 실패하도록 맨 앞에 둔다.
      - id: ver
        name: 다음 버전 계산
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # releases/latest 는 쓰지 않는다. 릴리스가 하나도 없으면 404 를 내면서
          # 에러 JSON 본문을 stdout 으로 뱉으므로, 종료 코드를 삼키는 순간
          # {"message":"Not Found",...} 가 그대로 버전 문자열로 잡혀버린다.
          # 목록 API 는 릴리스가 없어도 200 + [] 라서 예외 경로가 없고, 덤으로
          # created_at 순서가 아닌 semver 최대값을 고를 수 있다 (backport 대비).
          # 여기서 gh 가 실패하면 진짜 오류이므로 set -e 로 그대로 중단시킨다.
          TAGS=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')

          PREV_TAG=$(printf '%s\n' "$TAGS" | node -e '
            const RE = /^v?(\d+)\.(\d+)\.(\d+)$/;
            let best = null;
            let bestTag = "";
            for (const line of require("node:fs").readFileSync(0, "utf8").split("\n")) {
              const m = RE.exec(line.trim());
              if (!m) continue;
              const v = [Number(m[1]), Number(m[2]), Number(m[3])];
              const newer = !best
                || v[0] > best[0]
                || (v[0] === best[0] && (v[1] > best[1] || (v[1] === best[1] && v[2] > best[2])));
              if (newer) { best = v; bestTag = line.trim(); }
            }
            // 개행을 붙이지 않는다 — 명령 치환 결과가 태그 그 자체가 되도록
            process.stdout.write(bestTag);
          ')

          if [ -n "$PREV_TAG" ]; then
            BASE="${PREV_TAG#v}"
            echo "발행된 최신 릴리스: $PREV_TAG (기준 $BASE)"
          else
            BASE=$(node -p "require('./package.json').version")
            echo "발행된 릴리스 없음 → package.json 기준: $BASE"
          fi
          # Windows 러너의 Git Bash 가 섞어 넣을 수 있는 CR 등 공백류 제거
          BASE="${BASE//[[:space:]]/}"
          if ! [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::기준 버전 형식 오류: $BASE"
            exit 1
          fi

          IFS=. read -r MA MI PA <<< "$BASE"
          case "$BUMP" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          NEXT="$MA.$MI.$PA"
          echo "다음 버전: $NEXT ($BUMP)"

          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "::error::태그 v$NEXT 가 이미 존재합니다"
            exit 1
          fi

          {
            echo "prev_tag=$PREV_TAG"
            echo "next=$NEXT"
            echo "tag=v$NEXT"
          } >> "$GITHUB_OUTPUT"

      # 3) 버전 반영. package.json / package-lock.json 은 npm 자신에게 맡긴다
      #    (72KB lockfile 을 직접 파싱·재직렬화하면 diff 가 폭발한다).
      - name: 버전 적용 (npm)
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: npm version "$NEXT" --no-git-tag-version --allow-same-version

      # 타이틀바는 Vite define 이 package.json 에서 주입하므로 손댈 필요가 없다.
      # 남은 건 Cargo 두 파일과 tauri.conf.json.
      #  - Cargo.toml: src/apisix/client.rs 의 env!("CARGO_PKG_VERSION") User-Agent
      #  - tauri.conf.json: tauri-build 가 exe 의 FileVersion·ProductVersion 리소스를
      #    이 값으로 채운다. semver 로 파싱되지 않으면 '조용히 무시'하고 버전 리소스를
      #    아예 비워버리므로, 반드시 실제 semver 문자열이어야 한다.
      # JSON 을 재직렬화하지 않고 텍스트 치환하는 이유는 "targets": ["nsis", "msi"] 같은
      # 한 줄 배열이 여러 줄로 펼쳐져 diff 가 지저분해지는 것을 막기 위함이다.
      - name: 버전 적용 (cargo / tauri.conf.json)
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const v = process.env.NEXT;
            const edits = [
              // [package] 테이블의 행 선두 version — 이 파일에서 유일
              ["src-tauri/Cargo.toml", /^(version\s*=\s*)"[^"]*"/m],
              // 의존성이 아니라 api-gateway-manager 자신의 엔트리
              ["src-tauri/Cargo.lock", /(\[\[package\]\]\r?\nname = "api-gateway-manager"\r?\nversion = )"[^"]*"/],
              // 최상위 "version" 키. 중첩 키는 들여쓰기가 더 깊어 걸리지 않는다
              ["src-tauri/tauri.conf.json", /^(  "version": )"[^"]*"/m],
            ];
            for (const [file, re] of edits) {
              const before = fs.readFileSync(file, "utf8");
              const after = before.replace(re, (m, prefix) => prefix + JSON.stringify(v));
              if (after === before) {
                console.error("::error file=" + file + "::패턴이 매칭되지 않아 버전이 적용되지 않았습니다");
                process.exit(1);
              }
              fs.writeFileSync(file, after);
              console.log("patched " + file);
            }
            // 엉뚱한 중첩 키를 고쳤을 경우까지 잡아내는 최종 확인
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            if (conf.version !== v) {
              console.error("::error::tauri.conf.json 최상위 version 이 " + v + " 가 아닙니다: " + conf.version);
              process.exit(1);
            }
          '
          git --no-pager diff --stat

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # 4) 회귀 테스트 후 단독 실행 exe 빌드
      - name: 회귀 테스트
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      # --no-bundle 은 nsis/msi 생성을 건너뛴다. beforeBuildCommand(= npm run build
      # = tsc --noEmit && vite build) 는 번들링 이전 단계에서 실행되므로
      # --no-bundle 이어도 프런트엔드 빌드와 타입체크는 그대로 수행된다.
      - name: 빌드 (단독 실행 exe)
        run: npm run tauri:build:portable

      # mainBinaryName 을 설정하지 않았으므로 tauri-cli 는 바이너리를 rename 하지 않고
      # cargo 패키지명이 그대로 쓰인다 → 경로가 결정적이다.
      - id: asset
        name: 릴리스 자산 준비
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          SRC="src-tauri/target/release/api-gateway-manager.exe"
          if [ ! -f "$SRC" ]; then
            echo "::error::빌드 산출 exe 를 찾지 못했습니다: $SRC"
            ls -la src-tauri/target/release/*.exe || true
            exit 1
          fi
          NAME="API-Gateway-Manager-$TAG-windows-x64.exe"
          # target/ 은 .gitignore 대상이라 커밋을 오염시킬 수 없고,
          # 상대경로라 $RUNNER_TEMP(D:\a\_temp) 의 MSYS 경로 변환도 피한다.
          cp "$SRC" "src-tauri/target/release/$NAME"
          ls -l "src-tauri/target/release/$NAME"
          {
            echo "path=src-tauri/target/release/$NAME"
            echo "name=$NAME"
          } >> "$GITHUB_OUTPUT"

      # 커밋 '전에' 만든다 → PREV..HEAD 가 실제 출하 커밋만 담고
      # chore(release) 커밋 자신은 목록에서 빠진다.
      - id: notes
        name: 릴리스 본문 생성
        env:
          PREV_TAG: ${{ steps.ver.outputs.prev_tag }}
          TAG: ${{ steps.ver.outputs.tag }}
          ASSET_NAME: ${{ steps.asset.outputs.name }}
        run: |
          set -euo pipefail
          OUT="src-tauri/target/release/RELEASE_NOTES.md"
          {
            echo "## 변경 사항"
            echo
            if [ -n "$PREV_TAG" ] && git rev-parse -q --verify "refs/tags/$PREV_TAG" >/dev/null; then
              git log --no-merges --pretty=format:'- %s (%h)' "$PREV_TAG..HEAD"
              echo
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV_TAG...$TAG"
            else
              echo "_최초 릴리스 — 전체 커밋_"
              echo
              git log --no-merges --pretty=format:'- %s (%h)'
            fi
            echo
            echo
            echo "## 다운로드"
            echo
            echo "\`$ASSET_NAME\` — 설치 없이 바로 실행하는 Windows x64 단독 실행 파일입니다."
            echo "인스톨러가 아니므로 관리자 권한도, 설치 경로도 필요하지 않습니다."
            echo
            echo "> 실행에는 **Microsoft Edge WebView2 런타임**이 필요합니다."
            echo "> Windows 11 및 최신 Windows 10 에는 기본 포함되어 있습니다."
            echo "> 창이 열리지 않으면 <https://developer.microsoft.com/microsoft-edge/webview2/> 에서 설치하세요."
            echo ">"
            echo "> 코드 서명이 없어 첫 실행 시 SmartScreen 경고가 표시될 수 있습니다."
          } > "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          cat "$OUT"

      # 5) 빌드가 성공한 지금에서야 커밋 & push.
      #    앞 스텝이 하나라도 실패하면 fail-fast 로 여기 도달하지 않으므로
      #    실패한 빌드의 버전 커밋이 남는 일이 없다.
      - id: commit
        name: 버전 커밋 & push
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add -A 를 쓰지 않는다 — 빌드 산출물이 섞여 들어갈 여지를 없앤다
          git add package.json package-lock.json \
                  src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음 — HEAD 를 그대로 태깅합니다"
          else
            git commit -m "chore(release): v$NEXT"
          fi
          # 명령 치환을 echo 안에 두면 실패해도 echo 가 성공해 sha= 가 빈 값으로
          # 새어나간다. 별도 대입으로 두어 set -e 가 잡도록 한다.
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          for delay in 2 4 8 16; do
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              exit 0
            fi
            # non-fast-forward 라면 재시도해도 소용없다. 여기서 rebase 하면
            # 방금 빌드한 exe 에 없는 남의 커밋 위에 태그가 붙으므로 즉시 실패시킨다.
            git fetch origin "$GITHUB_REF_NAME"
            if ! git merge-base --is-ancestor "origin/$GITHUB_REF_NAME" HEAD; then
              echo "::error::빌드 중 $GITHUB_REF_NAME 에 다른 커밋이 올라왔습니다. 다시 실행하세요."
              exit 1
            fi
            echo "push 실패 — ${delay}s 후 재시도"
            sleep "$delay"
          done
          echo "::error::push 를 4회 재시도했지만 실패했습니다"
          exit 1

      # 6) Release 생성 + exe 첨부. --target 에 브랜치명이 아닌 정확한 SHA 를 주어
      #    push 직후 누군가 푸시했을 때 태그가 엉뚱한 커밋에 붙는 것을 막는다.
      - name: Release 생성
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
          NOTES: ${{ steps.notes.outputs.path }}
          ASSET: ${{ steps.asset.outputs.path }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$SHA" \
            --title "$TAG" \
            --notes-file "$NOTES" \
            --latest \
            "$ASSET#Portable Windows x64 executable"
          gh release view "$TAG" --json url --jq .url
